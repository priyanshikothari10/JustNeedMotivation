apiVersion: apps/v1
kind: Deployment
metadata:
  name: justneedmotivation
  namespace: justneedmotivation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: justneedmotivation
  template:
    metadata:
      labels:
        app: justneedmotivation
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: justneedmotivation
          image: DOCKERHUB_USERNAME/justneedmotivation:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: justneedmotivation-config
            - secretRef:
                name: justneedmotivation-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
